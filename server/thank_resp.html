<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Thank you — CodePod</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      body{font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f6f8fb}
      .card{background:#fff;padding:28px;border-radius:8px;box-shadow:0 6px 24px rgba(20,30,60,0.08);max-width:560px;text-align:center}
      .h1{font-size:22px;margin:0 0 8px}
      .p{color:#475569;margin:0 0 16px}
      .btn{display:inline-block;padding:10px 16px;border-radius:6px;background:#667eea;color:#fff;text-decoration:none}
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="h1">Thank you for your purchase!</h1>
      <p class="p">We've received your payment and are processing your order. A confirmation email will arrive shortly.</p>

      <div id="orderInfo" style="text-align:left;margin-top:16px">
        <div><strong>Order ID:</strong> <span id="orderId">—</span></div>
        <div><strong>Amount:</strong> <span id="orderAmount">—</span></div>
        <div><strong>Currency:</strong> <span id="orderCurrency">—</span></div>
        <div id="orderNote" style="color:#374151;margin-top:8px;font-size:0.9rem">If you have any questions, email support@codepod.example</div>
      </div>

      <div style="margin-top:18px">
        <a class="btn" id="backHome" href="/">Back to home</a>
        <a class="btn" id="viewReceipt" href="#" style="margin-left:8px;background:#10b981">View receipt</a>
      </div>
    </div>

    <script>
      (function () {
        function formatAmount(a, c) {
          try {
            const paise = Number(a || 0);
            const rupees = (paise / 100).toFixed(2);
            return '\u20B9' + rupees + (c ? (' ' + c) : '');
          } catch (e) { return a; }
        }

        // window.CodePodOrder is injected server-side on /thank-you.html
        const data = window.CodePodOrder || {};
        const idEl = document.getElementById('orderId');
        const amtEl = document.getElementById('orderAmount');
        const curEl = document.getElementById('orderCurrency');
        if (idEl) idEl.textContent = data.order || '—';
        if (amtEl) amtEl.textContent = data.amount ? formatAmount(data.amount, data.currency) : '—';
        if (curEl) curEl.textContent = data.currency || '—';

        // wire view receipt to open receipt page (if available) with query
        const viewBtn = document.getElementById('viewReceipt');
        if (viewBtn) {
          viewBtn.addEventListener('click', function (e) {
            e.preventDefault();
            const q = [];
            if (data.order) q.push('order=' + encodeURIComponent(data.order));
            if (data.amount) q.push('amount=' + encodeURIComponent(data.amount));
            if (data.currency) q.push('currency=' + encodeURIComponent(data.currency));
            window.location.href = '/receipt.html' + (q.length ? ('?' + q.join('&')) : '');
          });
        }
      })();
    </script>
    <script>window.CodePodOrder = {"order":"order_ABC123","amount":"2500","currency":"INR"};</script>
  </body>
</html>

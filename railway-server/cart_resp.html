<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cart - CodePod</title>
    <link rel="stylesheet" href="/assets/css/header.css" />
    <link rel="stylesheet" href="/assets/css/footer.css" />
    <style>
      body { font-family: Arial, Helvetica, sans-serif; padding: 1rem; }
      .cart-item { display:flex; gap:1rem; padding:0.5rem 0; border-bottom:1px solid #eee }
      .cart-item img { width:80px; height:80px; object-fit:cover }
      .cart-footer { margin-top:1rem; display:flex; justify-content:space-between; align-items:center }
      .btn { background:#0078d4; color:#fff; padding:0.6rem 1rem; border:none; cursor:pointer }
      .btn[disabled]{ opacity:0.6; cursor:default }
    </style>
  </head>
  <body>
    <h1>Your Cart</h1>
    <div id="cartList">(loading cart...)</div>

    <section id="customerBox" style="margin-top:1rem; padding:1rem; border:1px solid #eee; background:#fafafa">
      <h2>Customer details</h2>
      <div style="display:flex; gap:1rem; flex-wrap:wrap;">
        <label style="flex:1 1 200px">Name<br><input id="codepod_name" type="text" style="width:100%"/></label>
        <label style="flex:1 1 200px">Email<br><input id="codepod_email" type="email" style="width:100%"/></label>
        <label style="flex:1 1 200px">Phone<br><input id="codepod_phone" type="tel" style="width:100%" placeholder="10-digit mobile"/></label>
      </div>
      <div id="phoneError" style="color:#b00020; margin-top:0.5rem; display:none"></div>
    </section>

    <div class="cart-footer">
      <div>
        Total: ₹<span id="cartTotal">0.00</span>
      </div>
      <button id="proceedBtn" class="btn">Proceed to Buy</button>
    </div>

  <!-- libphonenumber-js UMD bundle (client-side validation) -->
  <script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1.10.22/bundle/libphonenumber-js.min.js"></script>
  <script>window.RAZORPAY_KEY_ID = "rzp_test_R5XmEfkjyyHrMQ";</script>
  <script src="/assets/js/cart.js"></script>
  </body>
</html>
